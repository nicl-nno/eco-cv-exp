data:
  input_size: 512
  split:
    train: 0.70
    val: 0.15
    test: 0.15

train:
  optimizer: AdamW
  schedule: cosine
  epochs: 50
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 0
  amp: true
  patience: 10
  seeds: [42, 123, 321]

eval:
  latency_warmup: 10
  latency_repeats: 50

augmentation:
  hflip_prob: 0.5
  vflip_prob: 0.5
  rotate_prob: 0.5
  scale_prob: 0.5
  rotation_degrees: 15
  scale_range: [0.85, 1.15]
  brightness: 0.2
  contrast: 0.2
  gaussian_noise_std: 0.02
  gaussian_blur_sigma: [0.1, 1.0]
