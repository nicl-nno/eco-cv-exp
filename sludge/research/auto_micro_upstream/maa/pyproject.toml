[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maa"
version = "0.1.0"
description = "Microscopy-Aware Attention and baseline architectures for microorganism CV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16", "einops>=0.7"]
vision = ["opencv-python-headless>=4.8", "Pillow>=10.0", "scikit-learn>=1.3", "tqdm>=4.66"]
dev = ["pytest>=7.0"]

[project.scripts]
maa-train-cls = "maa.training.classification.cli:main"
maa-eval-cls = "maa.evaluation.classification.cli:main"
maa-train-det = "maa.training.detection.cli:main"
maa-eval-det = "maa.evaluation.detection.cli:main"
maa-train-seg = "maa.training.segmentation.cli:main"
maa-eval-seg = "maa.evaluation.segmentation.cli:main"
maa-prepare-data = "maa.data.prepare:main"
maa-dataset-stats = "maa.data.statistics:main"
maa-run-baselines = "maa.training.experiments:main"
maa-viz-attention = "maa.attention.visualize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
